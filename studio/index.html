<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP Motion Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>body{margin:0;background:#111210;color:#f2f2e9;font:14px Manrope,Arial}header{display:flex;align-items:center;gap:12px;padding:16px}button,select{background:#d4fd55;color:#111210;border:0;padding:10px 16px;font:inherit;cursor:pointer}label{margin-left:auto}canvas{display:block;width:100%;aspect-ratio:16/9;max-height:80vh;object-fit:contain}#status{padding:14px;color:#d4fd55}input{width:96%;margin:12px 2%}</style></head><body>
<header><b>mp. / CINEMA STUDIO</b><button id="play">Воспроизвести</button><button id="record">Экспорт кадров</button><select id="lang"><option value="ru">RU</option><option value="en">EN</option></select><label>28 секунд / 1440p / 60 fps</label></header>
<main id="stage"></main><input id="time" aria-label="Время сцены" type="range" min="0" max="28" step="0.1" value="0"><div id="status">Загрузка сцены…</div>
<script type="module" src="film.js?v=3"></script></body></html>
